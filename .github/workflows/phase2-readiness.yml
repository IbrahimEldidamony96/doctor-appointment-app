name: Phase 2 readiness checks
on:
  push:
    branches:
      - 'feature/phase2-**'
      - 'fix/phase2-production-readiness'
  pull_request:
    branches:
      - main
      - 'fix/phase-1-backend-integrity'
      - 'feature/phase2-**'
      - 'fix/phase2-production-readiness'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck-lint-build:
    name: TypeScript, lint and production build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
  database-tests:
    name: SQL migration and security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Add isolated test tools without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.10 tsx@4.23.15
      - run: node --conditions=react-server --import tsx --test tests/*.test.ts
